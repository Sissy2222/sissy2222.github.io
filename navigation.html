

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sylvia Tutors - Global Navigation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-1.10.2.js"></script>

</head>

<body>
    
    <style>
     
        h1 {
            text-shadow: 2px 2px 4px #282828;
            color: #FFFFFF;
        }
        body, html {
            height: 100%;
            margin: 0;
        }

        /* Dropdown & Form Styles */
        .dropbtn {
            background-color: transparent;
            color: #63DEFD;
            padding: 6px;
            font-size: 18px;
            border: 2px solid #FFFFFF;
            box-shadow: 1px 1px 2px #282828;
            cursor: pointer;
            border-radius: 10px;
        }
        .dropdown {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            min-width: 350px;
            border-radius: 15px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1000;
            padding: 20px;
        }
        .show { display: block; }

        .input-group { margin: 10px 0; }
        .input-group label { display: block; color: #FFFFFF; margin-bottom: 5px; }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .submit-button {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #8686e3, #3b3494);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

      


    <center>
        <div class="dropdown">
            <button onclick="toggleDropdown()" class="dropbtn">
                <b>Text (816) 482-7104 &nbsp;&nbsp; Or &nbsp;&nbsp; Click Here To Email Questions?</b>
            </button>
            <div id="myDropdown" class="dropdown-content">
                <form name="nav" id="nav" action="https://formspree.io/f/xjkbevoz" method="POST">
                    <div class="input-group">
                        <label><b>Your Name</b></label>
                        <input type="text" placeholder="What do I call you?" name="name" required>
                    </div>
                    <div class="input-group">
                        <label><b>Your Email</b></label>
                        <input type="email" placeholder="Email address" name="email" required>
                    </div>
                    <div class="input-group">
                        <label><b>What troubles?</b></label>
                        <textarea rows="3" placeholder="What's on your mind?" name="because" required></textarea>
                    </div>
                    <button class="submit-button" type="submit">Submit</button>
                    <p id="navstatus" style="color: white; margin-top: 10px;"></p>
                </form>
            </div>
        </div>
    </center>

    <br>

   <div class="hero-container" style="position: relative; width: 100%;">
    
    <style>
        .hero-image-box {
            background-image: url("./images/derivativeandintegralsin3Dcalculustutoringandhomeworkhelpatsylviatutors.online.png");
            background-position: center;
            background-repeat: no-repeat;
            background-size: 100% 100%;
            min-height: 300px; 
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-table { 
            border-collapse: separate; 
            border-spacing: 20px; 
            background: rgba(0, 0, 0, 0.1); 
        }

        .nav-table h1 {
            text-shadow: 2px 2px 4px #282828;
            color: #FFFFFF;
            margin: 0;
        }

        .link-light { text-decoration: none; }
    </style>

   <center>
    <div class="hero-image-box">
        <div class="table-responsive">
            <table class="nav-table">
                <tr>
                    <td><a href="index.html" class="link-light"><h1><b>Home</b></h1></a></td>
                    <td><a href="tutoring.html" class="link-light"><h1><b>Tutoring</b></h1></a></td>
                    <td><a href="homeworkhelp.html" class="link-light"><h1><b>Homework Help</b></h1></a></td>
                    <td><a href="profile.html" class="link-light"><h1><b>Profile</b></h1></a></td>
                    <td><a href="archive.html" class="link-light"><h1><b>Archive</b></h1></a></td>
                </tr>
            </table>
        </div>
    </div>
        </center>
</div>
    <!-- Scripts -->
    <script>
        function toggleDropdown() {
            document.getElementById("myDropdown").classList.toggle("show");
        }

        const form = document.getElementById("nav");
        async function handleSubmit(event) {
            event.preventDefault();
            const status = document.getElementById("navstatus");
            const data = new FormData(event.target);
            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    $('#nav').fadeOut(1000);
                    status.innerHTML = "Got it!<br> I will get back with you shortly";
                } else {
                    status.innerHTML = "Oops! Something went wrong.";
                }
            }).catch(error => {
                status.innerHTML = "Oops! Something went wrong.";
            });
        }
        form.addEventListener("submit", handleSubmit);
    </script>

</body>
</html>
